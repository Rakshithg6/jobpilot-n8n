name: jobpilot

# Server variant of docker-compose.yml.
#
# Differences from the laptop version, and why:
#   - Postgres publishes no port: the database is only reachable inside Docker.
#   - n8n binds to 127.0.0.1 only, so the UI is never exposed to the internet.
#     Reach it with an SSH tunnel:
#       ssh -i <key> -L 5678:localhost:5678 ubuntu@<server-ip>
#     then open http://localhost:5678 on your laptop.
#   - Oracle Cloud's default ingress allows SSH (22) and blocks everything else,
#     so there is no firewall rule to add for n8n.
#
# Run from the project root:
#   docker compose -f deploy/docker-compose.server.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 12

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-key-change-before-deploy}
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Lets a small VM cap the Node heap instead of being OOM-killed.
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      # Keep executions for a while so you can inspect failures on the server.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRIES: ${ADZUNA_COUNTRIES:-de,at,ch,nl,fr,gb,pl,es,it,us}
      ADZUNA_QUERIES: ${ADZUNA_QUERIES:-software engineer}
      ADZUNA_MAX_REQUESTS: ${ADZUNA_MAX_REQUESTS:-12}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/workflows:ro

volumes:
  pgdata:
  n8n_data:
